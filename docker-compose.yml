version: '3.8'

services:
  stumped-backend:
    container_name: stumped-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    ports:
      - "3005:3005"
    env_file:
      - backend/.env
    environment:
      - PORT=3005
      - NODE_ENV=production
    networks:
      - db
      - tunnel

networks:
  # Logical names; the real external network is picked per environment.
  # Local defaults shown — production sets DB_NETWORK=shared-mysql and
  # TUNNEL_NETWORK=shared-tunnel-adkdev (see .env next to this file).
  db:
    external: true
    name: ${DB_NETWORK:-mysql_mysql_net}
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:-cloudflare-net}
